[project]
name = "restaurant-agent"
version = "0.1.0"
description = "Voice restaurant booking agent built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[google,runner,silero,webrtc]>=1.4.0",
    "pipecatcloud>=0.7.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "pytest>=8.0",
    "ruff>=0.12.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]